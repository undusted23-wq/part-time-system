spring.application.name=backend

# Server configuration
server.port=8080

# Database configuration
spring.datasource.url=jdbc:sqlite:/Users/stepbystep/Documents/smy/part-time-system/backend/database.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=admin
spring.datasource.password=admin

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security configuration
jwt.secret=ThisIsASecretKeyWithAtLeast64BytesLengthToMeetHS512RequirementThisIsASecretKeyWithAtLeast64BytesLengthToMeetHS512Requirement
jwt.expiration=86400000

# Logging configuration
logging.level.root=INFO
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
